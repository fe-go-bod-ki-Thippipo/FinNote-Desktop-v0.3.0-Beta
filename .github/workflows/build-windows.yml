name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate source
        run: npm test
      - name: Build Setup
        run: npm run dist:win -- --publish never
      - name: Build Portable
        run: npm run dist:portable -- --publish never
      - name: Upload Setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinNote-Desktop-v0.3.0-Beta-Setup
          path: dist/FinNote-Desktop-v0.3.0-Beta-Setup.exe
      - name: Upload Portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinNote-Desktop-v0.3.0-Beta-Portable
          path: dist-portable/FinNote-Desktop-v0.3.0-Beta-Portable.exe
