name: PR Validation
# Quality gate ก่อน Merge: syntax, version (SemVer), UAT isolation markers และ Unit Test
# ไม่สร้างไฟล์ .exe และไม่อัปโหลด Artifact
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate source and run unit tests
        run: npm test
